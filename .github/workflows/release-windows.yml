name: Release Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Install dependencies
        # Electron is downloaded by electron-builder during the publish step.
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Create GitHub release
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          gh release create $env:GITHUB_REF_NAME `
            --title $packageVersion `
            --notes "Launchline $packageVersion Windows release"

      - name: Build and publish release
        run: pnpm release:win
