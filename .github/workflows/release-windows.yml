name: Release Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - name: Install dependencies
        # Electron is downloaded by electron-builder during the publish step.
        shell: pwsh
        run: |
          $installOutput = pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only 2>&1
          $installExitCode = $LASTEXITCODE
          $installOutput | ForEach-Object { Write-Host $_ }

          if ($installExitCode -ne 0) {
            $message = ($installOutput | Out-String).Trim()
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pnpm install failed::$message"
            exit $installExitCode
          }

      - name: Build and publish release
        run: pnpm release:win
