<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launchline 部署任务</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ball { position: relative; width: 78px; height: 78px; margin: 2px; border: 1px solid rgba(255,255,255,.28); border-radius: 50%; background: #303733; box-shadow: 0 10px 28px rgba(20,28,23,.34); color: #fff; -webkit-app-region: drag; }
      .ring { position: absolute; inset: 6px; border: 2px solid #6fc49a; border-radius: 50%; animation: pulse 1.8s ease-in-out infinite; }
      .open { position: absolute; inset: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 0; border-radius: 50%; background: #3b4640; color: #fff; cursor: pointer; -webkit-app-region: no-drag; }
      .open strong { color: #8ed0ad; font-size: 20px; line-height: 1; }
      .open span { font-size: 8px; }
      .hide { position: absolute; top: 0; right: 1px; z-index: 2; width: 20px; height: 20px; padding: 0; border: 1px solid #657069; border-radius: 50%; background: #fbfcf9; color: #4d5851; cursor: pointer; -webkit-app-region: no-drag; }
      .ball.done .ring { border-color: #aeb7b0; animation: none; }
      .ball.done .open strong { color: #c9d0ca; }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="ball" class="ball">
      <div class="ring"></div>
      <button id="open" class="open" type="button" title="打开部署任务"><strong id="count">1</strong><span>部署中</span></button>
      <button id="hide" class="hide" type="button" title="隐藏悬浮球">−</button>
    </div>
    <script>
      const desktop = window.launchlineDesktop
      const ball = document.getElementById('ball')
      const count = document.getElementById('count')
      document.getElementById('open').addEventListener('click', () => desktop.restoreMainWindow())
      document.getElementById('hide').addEventListener('click', () => desktop.hideFloatingBall())
      desktop.onDeploymentCount((nextCount) => {
        count.textContent = String(nextCount)
        ball.classList.toggle('done', nextCount === 0)
      })
    </script>
  </body>
</html>
